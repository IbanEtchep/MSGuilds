config-version: 2

# The language and the guild levels moved to plugins/Artisan/modules/guilds/data/settings.yml,
# edited in the Artisan editor (the guilds folder, Settings). This file keeps what belongs to
# this server only.

chest:
  # false on every server other than the one hosting the guild chest (events…): the chest lives
  # in that server's memory, and a second server writing the same rows would lose or duplicate
  # items. A version shared across servers would need a lock.
  enabled: true
