schema: menu/v1
title:
  - kind: plain
    value:
      en: "<dark_red>Delete this rank?"
      fr: "<dark_red>Supprimer ce grade ?"
size: 27
inputs:
  - name: rank
    type: string
  - name: info
    type: list
    source: { ref: "guilds:ranks", filter: { id: "{rank}" } }
elements:
  - id: frame
    positions: "0-26"
    material: GRAY_STAINED_GLASS_PANE
    title: " "
  - id: rank
    positions: "13"
    iterates: { source: info, alias: r }
    material: PAINTING
    title: "{r.name}"
    lore:
      - en: "<gray>Members: <white>{r.members}"
        fr: "<gray>Membres : <white>{r.members}"
      - en: "<gray>Only a rank without members can be deleted."
        fr: "<gray>Seul un grade sans membre peut être supprimé."
  - id: confirm
    positions: "11"
    iterates: { source: info, alias: r }
    material: LIME_CONCRETE
    title:
      en: "<green>Delete"
      fr: "<green>Supprimer"
    click:
      left:
        - guilds:rank_delete: "{r.id}"
        - open_previous_menu
  - id: cancel
    positions: "15"
    material: RED_CONCRETE
    title:
      en: "<red>Cancel"
      fr: "<red>Annuler"
    click:
      left:
        - open_previous_menu
