schema: menu/v1
# The 'textured' version of menus/rank_delete_confirm.yaml: same inputs, same actions.
title:
  - kind: background
    asset_id: bg_rank_delete_confirm
  - kind: plain
    value:
      en: "<dark_red>Delete this rank?"
      fr: "<dark_red>Supprimer ce grade ?"
size: 27
inputs:
  - name: rank
    type: string
  - name: info
    type: list
    source: {ref: "guilds:ranks", filter: {id: "{rank}"}}
elements:
  - id: rank
    positions: "13"
    iterates: {source: info, alias: r}
    material: PAINTING
    title: "{r.name}"
    lore:
      en:
        - "<gray>Members: <white>{r.members}"
        - "<gray>Only a rank without members can be deleted."
      fr:
        - "<gray>Membres : <white>{r.members}"
        - "<gray>Seul un grade sans membre peut être supprimé."
  - id: confirm
    positions: "11"
    iterates: {source: info, alias: r}
    material: LIME_CONCRETE
    title:
      en: "<green>Delete"
      fr: "<green>Supprimer"
    click:
      left:
        - guilds:rank_delete: "{r.id}"
        - open_previous_menu
  - id: cancel
    positions: "15"
    image: {asset: close, fit: native}
    title:
      en: "<red>Cancel"
      fr: "<red>Annuler"
    click:
      left:
        - open_previous_menu
