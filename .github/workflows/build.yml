name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      # Tags v1.2.3 build version 1.2.3; everything else stays a snapshot.
      - name: Resolve version
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "value=2.0.0-SNAPSHOT" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and test
        run: bash ./gradlew --no-daemon build -PpluginVersion=${{ steps.version.outputs.value }}

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: '**/build/reports/tests/'

      - uses: actions/upload-artifact@v4
        with:
          name: artisanguilds-${{ steps.version.outputs.value }}
          path: |
            plugin/build/libs/ArtisanGuilds-*.jar
            guildquests/build/libs/ArtisanGuildQuests-*.jar

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: artisanguilds-*
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: '**/*.jar'
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
