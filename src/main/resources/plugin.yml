name: MSGuilds
version: ${project_version}
main: fr.iban.guilds.GuildsPlugin
api-version: 1.21
authors: [ Iban ]
description: Guilds plugin
depend: [ Core ]
softdepend:
  - Vault
  - PlaceholderAPI
permissions:
